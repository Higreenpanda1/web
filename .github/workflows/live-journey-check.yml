# Temporary diagnostic: drives the LIVE homepage in a real browser and reports
# whether the twelve journey steps stay visible after scrolling. Removed once
# the check has been read.
name: Live journey check

on:
  workflow_dispatch:
  push:
    branches: ['claude/keen-gates-1ta6i0']

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: What production serves
        run: |
          echo "--- headers"; curl -sSI https://higreenpanda.com/en | head -20
          curl -sS https://higreenpanda.com/en -o page.html
          echo "--- stylesheets"; grep -o 'href="[^"]*\.css[^"]*"' page.html
          for c in $(grep -o 'href="[^"]*\.css[^"]*"' page.html | sed 's/href="//;s/"//'); do
            curl -sS "https://higreenpanda.com$c" -o sheet.css
            echo "$c: data-revealed=$(grep -c 'data-revealed' sheet.css)  is-visible=$(grep -c 'is-visible' sheet.css)"
            grep -o 'js-reveal \[data-reveal\][^{]*{[^}]*}' sheet.css | head -5
          done
          echo "--- journey markup"; grep -o 'journey-step[^>]*' page.html | head -3
      - name: Scroll test against production
        run: |
          mkdir -p out
          cat > out/check.mjs <<'JS'
          // Drives the real homepage like a reader: load, scroll slowly to the bottom,
          // scroll back up to the journey, and report whether each of the 12 steps is visible.
          import { chromium } from 'playwright'
          
          const BASE = process.env.BASE ?? 'http://127.0.0.1:3000'
          const OUT = process.env.OUT ?? '.'
          const browser = await chromium.launch()
          
          async function run(locale, viewport, label) {
            const ctx = await browser.newContext({ viewport, isMobile: viewport.width < 500, hasTouch: viewport.width < 500 })
            const page = await ctx.newPage()
            const errors = []
            page.on('pageerror', (e) => errors.push(String(e)))
            page.on('console', (m) => { if (m.type() === 'error') errors.push(m.text()) })
            await page.goto(`${BASE}/${locale}`, { waitUntil: 'networkidle' })
            await page.waitForFunction(() => document.documentElement.classList.contains('js-reveal'), null, { timeout: 15000 }).catch(() => {})
            const cssInfo = await page.evaluate(async () => {
              const links = [...document.querySelectorAll('link[rel=stylesheet]')].map((l) => l.href)
              let text = ''
              for (const href of links) { try { text += await (await fetch(href)).text() } catch {} }
              return { sheets: links.length, hasNew: text.includes('data-revealed'), hasOld: text.includes('.is-visible') }
            })
            const steps = () => page.evaluate(() =>
              [...document.querySelectorAll('.journey-step')].map((el) => {
                const cs = getComputedStyle(el); const r = el.getBoundingClientRect()
                return { revealed: el.hasAttribute('data-revealed'), cls: el.className.includes('is-visible'), opacity: cs.opacity, transform: cs.transform, top: Math.round(r.top), h: Math.round(r.height) }
              }))
            const total = await page.evaluate(() => document.documentElement.scrollHeight)
            for (let y = 0; y < total; y += 90) { await page.evaluate((y) => window.scrollTo(0, y), y); await page.waitForTimeout(40) }
            await page.waitForTimeout(800)
            const afterDown = await steps()
            await page.evaluate(() => document.querySelector('#journey').scrollIntoView())
            await page.waitForTimeout(1000)
            const back = await steps()
            // scroll slowly through the journey again on the way up
            const jTop = await page.evaluate(() => window.scrollY)
            for (let y = jTop; y < jTop + 3000; y += 90) { await page.evaluate((y) => window.scrollTo(0, y), y); await page.waitForTimeout(40) }
            await page.evaluate(() => document.querySelector('#journey').scrollIntoView())
            await page.waitForTimeout(1000)
            await page.screenshot({ path: `${OUT}/${label}.png` })
            const final = await steps()
            const vis = (s) => s.map((x) => (x.opacity === '1' ? '✓' : '✗')).join('')
            console.log(`\n== ${label}  ${BASE}/${locale}  ${viewport.width}x${viewport.height}`)
            console.log(`css: sheets=${cssInfo.sheets} new(data-revealed)=${cssInfo.hasNew} old(.is-visible)=${cssInfo.hasOld}  js-reveal=${await page.evaluate(() => document.documentElement.classList.contains('js-reveal'))}`)
            console.log(`steps=${final.length}  after scrolling down: ${vis(afterDown)}   back at journey: ${vis(back)}   after second pass: ${vis(final)}`)
            console.log(`revealed attrs: ${final.map((x) => (x.revealed ? 'r' : '-')).join('')}  opacities: ${[...new Set(final.map((x) => x.opacity))].join(',')}`)
            if (errors.length) console.log('page errors:', errors.slice(0, 5))
            await ctx.close()
          }
          
          await run('en', { width: 390, height: 844 }, 'en-phone')
          await run('en', { width: 1366, height: 800 }, 'en-laptop')
          await run('ar', { width: 390, height: 844 }, 'ar-phone')
          await browser.close()
JS
          BASE=https://higreenpanda.com OUT=out node out/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-journey-screenshots
          path: out/*.png
