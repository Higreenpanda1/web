# ─────────────────────────────────────────────────────────────────────────────
# HiGreenPanda — production stack (Hostinger KVM 2, or any VPS with root,
# Docker and 2 vCPU / 8 GB)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy terminates TLS and renews certificates automatically. The app and the
# database are on an internal network with no published ports, so the only
# thing reachable from the internet is Caddy on 80/443.
#
# See DEPLOY.md for provisioning, bringing this stack up before DNS is pointed
# at it, backups and the restore test.
# ─────────────────────────────────────────────────────────────────────────────
name: higreenpanda

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Uploaded media lives on a volume, not in the image, so a redeploy never
      # loses it. Backed up nightly by the job in DEPLOY.md.
      - media:/app/media
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # One-off tooling: migrations, seeding, TOTP enrolment.
  #
  # Built from the `build` stage, not the runtime one. The runtime image
  # carries only Next's standalone output — an empty node_modules/.bin, no
  # src/migrations, no src/seed — so `npm run migrate` inside it fails with
  # "cross-env: not found". The standalone output does copy package.json, so
  # the scripts are listed there and look runnable, which is the trap.
  #
  # `profiles` keeps this out of `up -d`; it only ever runs via
  # `docker compose run --rm tools …` and exits. It shares the internal
  # network and the media volume, and it is never exposed.
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - media:/app/media
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-higreenpanda.com}
      ADMIN_IP_ALLOWLIST_CADDY: ${ADMIN_IP_ALLOWLIST_CADDY:-0.0.0.0/0}
      PREVIEW_HOSTNAME: ${PREVIEW_HOSTNAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # Nightly Postgres dump + media archive, pushed to off-server object storage.
  # Brief section 8: "No backups you controlled" is what made the last outage
  # unrecoverable. This runs in the stack so it cannot be forgotten.
  backup:
    build:
      context: ./ops/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - media:/backup-src/media:ro
      - ./.backups:/backup-out
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  media:
  caddy_data:
  caddy_config:
